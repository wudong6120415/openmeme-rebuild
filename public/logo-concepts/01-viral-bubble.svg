<!-- Concept 1: "Viral Speech Bubble" - 病毒气泡 -->
<!-- Idea: Speech bubble (meme) bursting open outward (open) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- background rounded square -->
  <rect width="200" height="200" rx="36" fill="#0a0a0a"/>

  <!-- Burst rays (the "open" expanding outward) -->
  <g stroke="#00ff88" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="14"  x2="100" y2="32"/>
    <line x1="178" y1="60"  x2="162" y2="72"/>
    <line x1="186" y1="100" x2="168" y2="100"/>
    <line x1="178" y1="140" x2="162" y2="128"/>
    <line x1="22"  y1="60"  x2="38"  y2="72"/>
    <line x1="14"  y1="100" x2="32"  y2="100"/>
    <line x1="22"  y1="140" x2="38"  y2="128"/>
  </g>

  <!-- Speech bubble (the meme) -->
  <path d="M 50 60
           Q 50 42 70 42
           L 130 42
           Q 150 42 150 60
           L 150 110
           Q 150 128 130 128
           L 90 128
           L 70 150
           L 75 128
           L 70 128
           Q 50 128 50 110
           Z"
        fill="#00ff88" stroke="#0a0a0a" stroke-width="3"/>

  <!-- Meme face inside bubble: triangle eyes (>_<) and small smile -->
  <g fill="#0a0a0a">
    <path d="M 76 70 L 86 82 L 96 70 L 92 67 L 86 75 L 80 67 Z"/> <!-- left eye  >-< -->
    <path d="M 104 70 L 114 82 L 124 70 L 120 67 L 114 75 L 108 67 Z"/> <!-- right eye >-< -->
    <path d="M 92 102 Q 100 110 108 102 L 108 105 Q 100 113 92 105 Z"/> <!-- smile -->
  </g>
</svg>
